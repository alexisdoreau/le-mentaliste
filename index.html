<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a10">
  <title>Le Détecteur — mens-moi</title>
  <meta name="description" content="Choisis un symbole. Mens-moi. Je le trouverai quand même.">
  <meta property="og:title" content="Le Détecteur">
  <meta property="og:description" content="Choisis un symbole. Mens-moi. Je le trouverai quand même.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top"><span class="mark" aria-hidden="true">◉</span> Le Détecteur</header>
    <section class="caption" aria-live="polite">
      <h1 id="title"></h1>
      <p id="sub"></p>
    </section>
    <div id="stage">
      <svg id="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" /></svg>
      <div id="symbols"></div>
      <div id="probe" hidden>
        <div id="probeIcon"></div>
        <div id="probeName"></div>
      </div>
      <div id="bars" hidden></div>
      <p id="oracleText"></p>
    </div>
    <div id="progress" hidden></div>
    <footer id="controls"></footer>
  </div>
  <aside id="debug" hidden></aside>
  <script src="oracle.js"></script>
  <script src="detector.js"></script>
  <script src="app.js"></script>
</body>
</html>
